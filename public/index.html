<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Disposable Chat</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="light-mode theme-blue">

    <!-- 🟢 1. TOP AD BANNER (ఎల్లప్పుడూ కనిపిస్తుంది) -->
    <div class="ad-banner-top">
        <iframe data-aa='2448958' src='//acceptable.a-ads.com/2448958/?size=Adaptive' style='border:0; padding:0; width:100%; height:90px; overflow:hidden; display:block; margin:auto;'></iframe>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="color-picker">
            <span class="color-dot dot-blue" onclick="setColor('theme-blue')"></span>
            <span class="color-dot dot-orange" onclick="setColor('theme-orange')"></span>
            <span class="color-dot dot-green" onclick="setColor('theme-green')"></span>
            <span class="color-dot dot-pink" onclick="setColor('theme-pink')"></span>
            <span class="color-dot dot-yellow" onclick="setColor('theme-yellow')"></span>
            <span class="color-dot dot-hacker" onclick="setColor('theme-hacker')"></span>
        </div>
        <button class="mode-toggle" onclick="toggleMode()">🌓</button>
    </div>

    <!-- 1. Home Screen -->
    <div class="screen-container" id="home-screen" style="flex-direction: column;">
        <div class="center-box" style="margin-bottom: 0;">
            <div class="brand-header">
                <h2>Disposable Chat</h2>
                <p>Private & Anonymous Messaging</p>
            </div>
            
            <button class="primary-btn" onclick="generateCode()">Create Room</button>
            
            <div class="divider"><span>OR</span></div>
            
            <div class="join-box">
                <input type="text" id="join-code" placeholder="ENTER 6-DIGIT CODE" maxlength="6">
                <button class="primary-btn" onclick="joinCode()">Join</button>
            </div>
        </div>
    </div>

    <!-- 2. Waiting Screen (కోడ్ చూపించే స్క్రీన్) -->
    <div class="screen-container hidden" id="waiting-screen">
        <div class="center-box">
            <h3>Your Room Code</h3>
            <div class="code-display" id="display-code">------</div>
            <p class="waiting-text">Waiting for partner...</p>
            
            <div class="divider"><span>OR SHARE LINK</span></div>
            
            <div class="join-box">
                <input type="text" id="invite-link" class="invite-link-input" readonly>
                <button class="primary-btn" onclick="copyLink()">Copy</button>
            </div>
        </div>
    </div>

    <!-- 3. Chat Screen -->
    <div class="chat-container hidden" id="chat-screen">
        <div class="chat-header">
            <div class="room-info">
                <span class="online-dot"></span>
                Secure Chat
            </div>
            <button class="danger-btn" onclick="endChat()">Exit ✖</button>
        </div>
        
        <div id="chat-box" class="chat-box"></div>
        
        <div class="input-wrapper">
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Message..." onkeypress="handleKeyPress(event)">
                <button id="record-btn" class="icon-btn" onclick="toggleRecording()">🎤</button>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- 🟢 2. BOTTOM AD BANNER (ఎల్లప్పుడూ కనిపిస్తుంది) -->
    <div class="ad-banner-bottom">
        <iframe data-aa='2448958' src='//acceptable.a-ads.com/2448958/?size=Adaptive' style='border:0; padding:0; width:100%; height:90px; overflow:hidden; display:block; margin:auto;'></iframe>
    </div>

    <!-- 🟢 3. FULL SCREEN AD MODAL (RC20 Game Style) -->
    <div id="adModal" class="ad-modal-overlay">
        <div class="ad-modal-content">
            <!-- ఈ బటన్ మొదట హైడ్ చేసి ఉంటుంది, JS ద్వారా చూపిస్తాం -->
            <button id="closeAdBtn" class="close-ad-btn" style="display: none;" onclick="closeAdAndShowCode()">✕</button>
            <h3 style="margin-bottom: 15px; color: #333;">Advertisement</h3>
            
            <div style="width: 100%; height: 250px; background: #f0f0f0; display: flex; justify-content: center; align-items: center;">
                <iframe data-aa='2448958' src='//acceptable.a-ads.com/2448958/?size=Adaptive' style='border:0; padding:0; width:100%; height:100%; overflow:hidden; display:block;'></iframe>
            </div>
            <!-- టైమర్ లోడింగ్ టెక్స్ట్ -->
            <p id="adTimerText" style="font-size: 12px; color: #666; margin-top: 10px;">You can skip this ad in <span id="timeCount">4</span>s...</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
